project:
  type: book
  output-dir: output
  # GitHub Pages reads the custom domain from a CNAME file in the published
  # branch, and `quarto publish gh-pages` replaces that branch wholesale on
  # every run. Listing it as a resource is what copies it into the output, so
  # the domain survives each publish rather than needing to be re-entered in
  # the repository settings afterwards.
  resources:
    - CNAME

execute:
  # `auto` re-executes a chapter only when its source changes. `_freeze/` is
  # gitignored, so CI has no cache and executes everything fresh - this setting
  # only affects local renders, where `true` would serve stale cached output
  # after an edit.
  freeze: auto
  echo: true      # Show code chunks in output
  eval: true      # Evaluate code chunks
  warning: false  # Don't show warnings

book:
  title: "Ready Before Run()"
  subtitle: "A Practical Guide to Gear Up for Data Science"
  author: "Cesaire Tobias"
  date: "2026-08-21"
  chapters:
    - index.qmd
    - chapters/intro.qmd
    - part: "Foundations"
      chapters:
        # Git comes before Data Stores: the credentials and .gitignore
        # material there is written on the assumption you can commit.
        - chapters/command_line.qmd
        - chapters/languages.qmd
        - chapters/ide_git.qmd
        - chapters/data_stores.qmd
        - chapters/environments.qmd
    - part: "Communicating Results"
      chapters:
        - chapters/reporting.qmd
        - chapters/visualisation.qmd
    - part: "Shipping Your Work"
      chapters:
        - chapters/cloud.qmd
        - chapters/web_dev.qmd
        - chapters/containers.qmd
        - chapters/deployment.qmd
        - chapters/workflows.qmd
    - chapters/summary.qmd
    - chapters/references.qmd
  appendices:
    - chapters/utility_tools.qmd
    - chapters/appendix_troubleshooting.qmd
  cover-image: assets/cover_no_auth.png
  favicon: assets/cover_no_auth.png
  repo-url: "https://github.com/ces0491/rbr"
  site-url: "https://rbr.sheetsolved.com"
  description: >-
    A practical guide to the infrastructure data science assumes you already
    have - the command line, reproducible environments, data stores, version
    control, reporting, containers and deployment - written for people who
    arrived at data work from somewhere other than computer science.
  open-graph: true
  twitter-card: true
  search: true
  # downloads: [pdf, epub]  # Disabled - Mermaid rendering times out in CI

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    toc-location: right
    embed-resources: false
    self-contained: false
    link-external-icon: false
    link-external-newwindow: true
    # Code is the content in a setup book - don't hide it behind a click
    code-fold: false
    code-copy: true

# PDF/EPUB disabled - Mermaid diagrams require Chromium which times out in CI
# To generate PDF/EPUB, run `quarto render` locally and upload manually
